; ESP32 wireless button box for the MOZA Universal Hub bridge (sim/hub_bridge.py).
;
;   cp include/config.example.h include/config.h   # set Wi-Fi + bridge address + pins
;   pio run -t upload && pio device monitor
;
; Any classic ESP32 / S2 / S3 / C3 board works; change `board` to match yours.

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags = -Wall
